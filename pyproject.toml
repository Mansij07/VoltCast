[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voltcast"
version = "0.1.0"
description = "Electricity Demand Forecasting and Load Profiling (UCI Household Power)"
requires-python = ">=3.11,<3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::pyparsing.warnings.PyparsingDeprecationWarning:matplotlib.*",
    "ignore:Could not find the number of physical cores:UserWarning:joblib.*",
]